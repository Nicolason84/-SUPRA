name: Validate Combat Preflight V1

on:
  push:
    branches:
      - preflight-v1-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preflight invariants
        run: |
          set -euxo pipefail
          grep -Fq 'SUPRAGabrielConductorRuntime.load()' SUPRA/MissionStore.swift
          grep -Fq 'loadDecisionBoards()' SUPRA/DecisionStore.swift
          grep -Fq 'isHealthyPayload' SUPRA/SUPRAChatRuntimeAdapter.swift
          grep -Fq 'SUPRAChatView()' SUPRA/SUPRAOJOHomeView.swift
          grep -Fq 'OJOWorkspaceView()' SUPRA/SUPRAOJOHomeView.swift
          echo PREFLIGHT_INVARIANTS_PASS

      - name: Resolve packages
        run: |
          set -euxo pipefail
          for ATTEMPT in 1 2 3; do
            xcodebuild -project SUPRA.xcodeproj -scheme SUPRA -resolvePackageDependencies && exit 0
            [ "$ATTEMPT" = "3" ] && exit 1
            sleep 3
          done

      - name: Build Release
        run: |
          set -euxo pipefail
          xcodebuild             -project SUPRA.xcodeproj             -scheme SUPRA             -configuration Release             -sdk macosx             -derivedDataPath "$RUNNER_TEMP/SUPRA_DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Artifact check
        run: |
          test -d "$RUNNER_TEMP/SUPRA_DerivedData/Build/Products/Release/SUPRA.app"
          echo COMBAT_PREFLIGHT_BUILD_PASS
