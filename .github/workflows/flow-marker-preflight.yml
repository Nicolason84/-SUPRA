name: Flow Marker Preflight

on:
  push:
    branches:
      - supra/flow-marker-preflight-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Flow marker invariants
        run: |
          set -euxo pipefail
          test -f SUPRA/SUPRAFlowMarker.swift
          test -f docs/SUPRA_FLOW_MARKER_V1.md
          test -f docs/SUPRA_FLOW_MARKER_V1.json

          grep -Fq 'FLOW_MARKER_IS_NOT_AN_ENGINE=YES' docs/MISSION_NOVA_ERA_EXECUTIVE_ORGANISM_V3_20260921.md
          grep -Fq 'NO_NEW_ENGINE=YES' docs/SUPRA_FLOW_MARKER_V1.md
          grep -Fq 'NO_NEW_BRIDGE=YES' docs/SUPRA_FLOW_MARKER_V1.md
          grep -Fq 'NO_NEW_RUNTIME=YES' docs/SUPRA_FLOW_MARKER_V1.md

          grep -Fq '"flow_marker": try flowMarker.asJSONObject()' SUPRA/SUPRAGrandeMissionRunner.swift
          grep -Fq 'FLOW_ID=' SUPRA/SUPRAGrandeMissionRunner.swift
          grep -Fq 'TRACE_ID=' SUPRA/SUPRAGrandeMissionRunner.swift
          grep -Fq 'SPAN_ID=' SUPRA/SUPRAGrandeMissionRunner.swift
          grep -Fq 'EDGE_ID=' SUPRA/SUPRAGrandeMissionRunner.swift

          grep -Fq 'observedFlowMarker' SUPRA/SUPRAProcessObservatoryView.swift
          grep -Fq 'Flow Fabric' SUPRA/SUPRAProcessObservatoryView.swift
          grep -Fq 'flowFluidity' SUPRA/SUPRAProcessObservatoryView.swift

      - name: Marker schema contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("docs/SUPRA_FLOW_MARKER_V1.json")
          data=json.loads(p.read_text())
          assert data["creates_engine"] is False
          assert data["creates_runtime"] is False
          assert data["creates_bridge"] is False

          required={
            "flow_id","trace_id","span_id","parent_span_id",
            "mission_id","phase_id","node_id","previous_node_id",
            "edge_id","created_at","entered_at","started_at",
            "finished_at","queue_ms","service_ms","wait_ms",
            "status","outcome","retry_count","evidence_refs",
            "memory_return","canon_return"
          }
          got=set(data["marker_fields"])
          missing=sorted(required-got)
          assert not missing, missing

          states=set(data["fluidity_states"])
          assert {"FREE_FLOW","PROGRESSING","CONGESTED","STALLED","BLOCKED","DEGRADED","RECOVERING","COMPLETE"} <= states
          print("FLOW_MARKER_SCHEMA=PASS")
          PY

      - name: Resolve
        run: |
          set -euxo pipefail
          for ATTEMPT in 1 2 3; do
            xcodebuild               -project SUPRA.xcodeproj               -scheme SUPRA               -resolvePackageDependencies && exit 0
            [ "$ATTEMPT" = "3" ] && exit 1
            sleep 3
          done

      - name: Release build
        run: |
          set -euxo pipefail
          xcodebuild             -project SUPRA.xcodeproj             -scheme SUPRA             -configuration Release             -sdk macosx             -derivedDataPath "$RUNNER_TEMP/SUPRA_FLOW_DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Bundle integrity
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/SUPRA_FLOW_DerivedData/Build/Products/Release/SUPRA.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/SUPRA"
          test -f "$APP/Contents/Info.plist"

      - name: Create receipt
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/SUPRA_FLOW_DerivedData/Build/Products/Release/SUPRA.app"
          EXEC="$APP/Contents/MacOS/SUPRA"
          SHA="$(shasum -a 256 "$EXEC" | awk '{print $1}')"
          cat > "$RUNNER_TEMP/FLOW_MARKER_PREFLIGHT.json" <<EOF
          {
            "schema": "SUPRA_FLOW_MARKER_PREFLIGHT_V1",
            "commit": "$GITHUB_SHA",
            "creates_engine": false,
            "creates_runtime": false,
            "creates_bridge": false,
            "release_build": "PASS",
            "bundle_integrity": "PASS",
            "executable_sha256": "$SHA"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SUPRA-flow-marker-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/FLOW_MARKER_PREFLIGHT.json
          retention-days: 14
