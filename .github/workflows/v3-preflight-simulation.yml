name: V3 Preflight Simulation

on:
  push:
    branches:
      - supra/v3-preflight-simulation-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: Preflight harness syntax
        run: |
          set -euxo pipefail
          python3 -m py_compile RECOVERY/V3_PREFLIGHT_SIMULATION.py

      - name: Static + synthetic V3 simulations
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/V3_PREFLIGHT"
          python3 RECOVERY/V3_PREFLIGHT_SIMULATION.py "$RUNNER_TEMP/V3_PREFLIGHT"

      - name: Resolve dependencies
        run: |
          set -euxo pipefail
          for ATTEMPT in 1 2 3; do
            xcodebuild               -project SUPRA.xcodeproj               -scheme SUPRA               -resolvePackageDependencies && exit 0
            [ "$ATTEMPT" = "3" ] && exit 1
            sleep 3
          done

      - name: Release build
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/V3_PREFLIGHT"
          set +e
          xcodebuild             -project SUPRA.xcodeproj             -scheme SUPRA             -configuration Release             -sdk macosx             -derivedDataPath "$RUNNER_TEMP/SUPRA_V3_DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build 2>&1 | tee "$RUNNER_TEMP/V3_PREFLIGHT/xcodebuild-release.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "$RC" > "$RUNNER_TEMP/V3_PREFLIGHT/release-build.rc"
          if [ "$RC" -eq 0 ]; then
            echo "RELEASE_BUILD=PASS"
          else
            echo "RELEASE_BUILD=FAIL"
          fi
          exit 0

      - name: Bundle integrity
        run: |
          set -u
          APP="$RUNNER_TEMP/SUPRA_V3_DerivedData/Build/Products/Release/SUPRA.app"
          OUT="$RUNNER_TEMP/V3_PREFLIGHT/bundle-integrity.txt"
          RC=0
          {
            test -d "$APP" || RC=1
            test -x "$APP/Contents/MacOS/SUPRA" || RC=1
            test -f "$APP/Contents/Info.plist" || RC=1
            if [ "$RC" -eq 0 ]; then
              /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist"
              du -sh "$APP"
            fi
            echo "BUNDLE_INTEGRITY_RC=$RC"
          } | tee "$OUT"
          echo "$RC" > "$RUNNER_TEMP/V3_PREFLIGHT/bundle-integrity.rc"
          exit 0

      - name: Ad-hoc signing simulation
        run: |
          set -u
          SRC="$RUNNER_TEMP/SUPRA_V3_DerivedData/Build/Products/Release/SUPRA.app"
          CANDIDATE="$RUNNER_TEMP/V3_PREFLIGHT/SUPRA-V3-CANDIDATE.app"
          LOG="$RUNNER_TEMP/V3_PREFLIGHT/signing-simulation.log"
          RC=0
          if [ ! -d "$SRC" ]; then
            echo "SOURCE_APP_MISSING" | tee "$LOG"
            RC=1
          else
            /usr/bin/ditto "$SRC" "$CANDIDATE" >>"$LOG" 2>&1 || RC=1
            /usr/bin/codesign               --force               --deep               --sign -               --entitlements SUPRA/SUPRA.entitlements               "$CANDIDATE" >>"$LOG" 2>&1 || RC=1
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$CANDIDATE" >>"$LOG" 2>&1 || RC=1
            /usr/bin/codesign -d --entitlements :- "$CANDIDATE"               > "$RUNNER_TEMP/V3_PREFLIGHT/candidate-entitlements.plist" 2>&1 || true
          fi
          echo "$RC" > "$RUNNER_TEMP/V3_PREFLIGHT/signing-simulation.rc"
          cat "$LOG"
          exit 0

      - name: Cold-start survival smoke
        run: |
          set -u
          APP="$RUNNER_TEMP/V3_PREFLIGHT/SUPRA-V3-CANDIDATE.app"
          LOG="$RUNNER_TEMP/V3_PREFLIGHT/cold-start.log"
          /usr/bin/open -n "$APP" >"$LOG" 2>&1
          OPEN_RC=$?
          sleep 6
          PIDS="$(pgrep -f "$APP/Contents/MacOS/SUPRA" || true)"
          {
            echo "OPEN_RC=$OPEN_RC"
            echo "PIDS=$PIDS"
          } >> "$LOG"
          if [ -n "$PIDS" ]; then
            echo "COLD_START_SURVIVED=YES" >> "$LOG"
            echo "0" > "$RUNNER_TEMP/V3_PREFLIGHT/cold-start.rc"
            for pid in $PIDS; do kill "$pid" || true; done
          else
            echo "COLD_START_SURVIVED=UNPROVEN" >> "$LOG"
            echo "1" > "$RUNNER_TEMP/V3_PREFLIGHT/cold-start.rc"
          fi
          exit 0

      - name: Scan warnings and Swift errors
        if: always()
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/V3_PREFLIGHT"
          LOG="$RUNNER_TEMP/V3_PREFLIGHT/xcodebuild-release.log"
          OUT="$RUNNER_TEMP/V3_PREFLIGHT/compiler-signals.txt"
          if [ -f "$LOG" ]; then
            grep -E 'warning:|error:' "$LOG" > "$OUT" || true
          else
            echo "release log unavailable" > "$OUT"
          fi
          cat "$OUT"

      - name: Create preflight meta receipt
        if: always()
        run: |
          set -u
          OUT="$RUNNER_TEMP/V3_PREFLIGHT"
          mkdir -p "$OUT"
          cat > "$OUT/PREFLIGHT_META.json" <<EOF
          {
            "schema": "SUPRA_V3_PREFLIGHT_META_V1",
            "head_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "runner_os": "${RUNNER_OS}",
            "candidate_deployed": false,
            "external_side_effects_permitted": false
          }
          EOF

      - name: Final preflight gate
        if: always()
        run: |
          set -u
          OUT="$RUNNER_TEMP/V3_PREFLIGHT"
          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          report=json.loads((out/"V3_PREFLIGHT_REPORT.json").read_text()) if (out/"V3_PREFLIGHT_REPORT.json").exists() else {"counts":{"blocker":999}}
          static_blockers=int(report.get("counts",{}).get("blocker",999))
          def rc(name, default=1):
              p=out/name
              try: return int(p.read_text().strip())
              except Exception: return default
          build=rc("release-build.rc")
          bundle=rc("bundle-integrity.rc")
          sign=rc("signing-simulation.rc")
          cold=rc("cold-start.rc")
          final={
            "schema":"SUPRA_V3_PREFLIGHT_FINAL_GATE_V1",
            "static_blockers":static_blockers,
            "release_build_rc":build,
            "bundle_integrity_rc":bundle,
            "signing_simulation_rc":sign,
            "cold_start_rc":cold,
            "cold_start_is_blocking":False,
          }
          hard_fail = static_blockers>0 or build!=0 or bundle!=0 or sign!=0
          final["verdict"]="BLOCKED" if hard_fail else ("PASS_WITH_COLD_START_UNPROVEN" if cold!=0 else "PASS")
          (out/"FINAL_GATE.json").write_text(json.dumps(final,indent=2)+"\n")
          print(json.dumps(final,indent=2))
          sys.exit(1 if hard_fail else 0)
          PY

      - name: Upload V3 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SUPRA-V3-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/V3_PREFLIGHT
          if-no-files-found: error
          retention-days: 14
